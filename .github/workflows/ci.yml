# Folyamatos integráció (CI): minden push és pull request után lefut a GitHub ingyenes gépein.
# Ha bármelyik lépés hibára fut, a commit mellett piros X jelenik meg a GitHubon.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Egy ágon egyszerre csak a legfrissebb futás fusson
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Backend: kódstílus (Pint) és tesztek (PHPUnit, memóriában futó SQLite-on)
  backend:
    name: Backend – Pint és tesztek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, pdo_mysql, gd
          coverage: none

      - name: Composer gyorsítótár
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Kódstílus (Pint)
        run: ./vendor/bin/pint --test

      - name: Tesztek
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  # 2. Frontend: lint (ESLint) és production build
  frontend:
    name: Frontend – ESLint és build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # 3. Docker: a teljes környezet felépítése és elindítása, majd füstteszt (smoke test)
  docker:
    name: Docker – build és füstteszt
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Környezet indítása
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Füstteszt
        run: |
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent http://localhost:8080/api/featured-products | grep -q Margherita
          curl --fail --silent --output /dev/null http://localhost:8080/

      - name: Naplók hiba esetén
        if: failure()
        run: docker compose logs --tail=200

      - name: Leállítás
        if: always()
        run: docker compose down -v

  # 4. Image-ek publikálása a GitHub Container Registrybe (ingyenes) – csak a master ágon
  publish:
    name: Image-ek publikálása (GHCR)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image név (a GHCR csak kisbetűt fogad el)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/one-more-slice" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
