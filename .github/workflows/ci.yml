# Folyamatos integráció (CI): minden push és pull request után lefut a GitHub ingyenes gépein.
# Ha bármelyik lépés hibára fut, a commit mellett piros X jelenik meg a GitHubon.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Egy ágon egyszerre csak a legfrissebb futás fusson
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Backend: kódstílus (Pint) és tesztek (PHPUnit, memóriában futó SQLite-on)
  backend:
    name: Backend – Pint és tesztek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, pdo_mysql, gd
          coverage: none

      - name: Composer gyorsítótár
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Kódstílus (Pint)
        run: ./vendor/bin/pint --test

      - name: Tesztek
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  # 2. Frontend: lint (ESLint) és production build
  frontend:
    name: Frontend – ESLint és build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # 3. Docker: a teljes környezet felépítése és elindítása, füstteszt (smoke test),
  #    majd a master ágon a MÁR kipróbált image-ek feltöltése a GitHub Container Registrybe (ingyenes)
  docker:
    name: Docker – build, füstteszt, publikálás
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Környezet indítása
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Füstteszt
        run: |
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent http://localhost:8080/api/featured-products | grep -q Margherita
          curl --fail --silent --output /dev/null http://localhost:8080/

      - name: Naplók hiba esetén
        if: failure()
        run: docker compose logs --tail=200

      - name: Leállítás
        if: always()
        run: docker compose down -v

      # Nem építünk újra: pontosan az az image kerül fel, amelyiket a füstteszt ellenőrzött
      - name: Bejelentkezés a GHCR-be (csak master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-ek publikálása (csak master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/one-more-slice"   # a GHCR csak kisbetűt fogad el
          for NAME in backend web; do
            docker tag "one-more-slice/$NAME:local" "$PREFIX-$NAME:latest"
            docker tag "one-more-slice/$NAME:local" "$PREFIX-$NAME:${{ github.sha }}"
            docker push "$PREFIX-$NAME:latest"
            docker push "$PREFIX-$NAME:${{ github.sha }}"
          done
