# Naplóformátum monitoringhoz: a szokásos adatok mellett a válaszidő ($request_time, másodpercben) is
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # A hivatalos nginx image-ben ez a fájl a konténer kimenetére mutat: docker compose logs web
    access_log /var/log/nginx/access.log timed;

    # Nagy termékképek feltöltéséhez (a php.ini-vel összhangban)
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # API kérések → Laravel (php-fpm, FastCGI protokollon)
    location /api/ {
        include fastcgi_params;
        # A backend címe környezeti változóból jön (alapból „backend”; AWS ECS/Fargate-en 127.0.0.1)
        fastcgi_pass ${BACKEND_HOST}:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    # Feltöltött termékképek közvetlenül a közös volume-ból
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        access_log off;
    }

    # A buildelt JS/CSS fájlnevében hash van, ezért sokáig tárolhatók
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: minden más útvonal az index.html-re esik vissza.
    # Az index.html-t nem szabad cache-elni, különben egy új build után a böngésző a régi JS-t töltené be.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
