# One more slice – helyi futtatás Dockerrel
# Indítás: docker compose up -d --build   →   http://localhost:8080
# A beállítások a gyökérben lévő .env fájlból jönnek (minta: .env.example); .env nélkül az alapértékekkel indul.

name: one-more-slice

services:
  # Adatbázis
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-onemoreslice}
      MYSQL_USER: ${DB_USERNAME:-onemoreslice}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"   # külső eléréshez (pl. HeidiSQL); 3307, hogy ne ütközzön a XAMPP-pal
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Laravel API (php-fpm)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: one-more-slice/backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "One more slice"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:${APP_PORT:-8080}
      FRONTEND_URL: http://localhost:${APP_PORT:-8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-onemoreslice}
      DB_USERNAME: ${DB_USERNAME:-onemoreslice}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@onemoreslice.hu
      MAIL_FROM_NAME: "One more slice"
      STRIPE_SECRET: ${STRIPE_SECRET:-}
    volumes:
      - uploads:/var/www/html/public/uploads
      - storage:/var/www/html/storage
    networks: [backend-net, frontend-net]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Nginx: a React build kiszolgálása + reverse proxy az API felé
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID:-}
        VITE_EMAILJS_TEMPLATE_ID: ${VITE_EMAILJS_TEMPLATE_ID:-}
        VITE_EMAILJS_TEMPLATE_ID2: ${VITE_EMAILJS_TEMPLATE_ID2:-}
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY:-}
        VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY:-}
    image: one-more-slice/web:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - uploads:/var/www/uploads:ro
    networks: [frontend-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Levélfogó: a regisztrációs és jelszó-visszaállító e-mailek itt nézhetők meg (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [backend-net]

  # Adatbázis-kezelő felület (http://localhost:8081) – a XAMPP phpMyAdmin a XAMPP MySQL-jét látja, nem ezt
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks: [backend-net]

volumes:
  db-data:
  uploads:
  storage:

# Két hálózat: az nginx nem látja közvetlenül az adatbázist
networks:
  frontend-net:
  backend-net:
