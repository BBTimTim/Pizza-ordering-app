# Az aktív szín egyetlen sorban van megadva (active/upstream.conf), pl.: server blue-web:80;
# A deploy script ezt a sort írja át, majd `nginx -s reload`-ot hív: az nginx a futó kéréseket
# még a régi workerekkel fejezi be, az újakat már az új színhez küldi – így nincs kiesés.
upstream app {
    include /etc/nginx/active/upstream.conf;
}

server {
    listen 80;
    client_max_body_size 32m;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
