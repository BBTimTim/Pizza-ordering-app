# SSH hardening – a szerver SSH-beállításainak megszigorítása
# (az sshd_config nem enged megjegyzést a sor végén, ezért minden magyarázat külön sorban van)

# root felhasználóval nem lehet belépni
PermitRootLogin no
# jelszóval nem lehet belépni, csak SSH-kulccsal
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
# csak a deploy felhasználó léphet be
AllowUsers deploy
# legfeljebb 3 próbálkozás kapcsolatonként, és 30 mp alatt be kell jelentkezni
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
