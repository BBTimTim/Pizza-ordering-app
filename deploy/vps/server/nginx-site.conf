# nginx site konfiguráció a VPS-en
# A /var/www/onemoreslice/current egy symlink az aktuális release mappájára.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;

    # Saját naplófájlok (monitoringhoz): ki mit kért, és milyen hiba történt
    access_log /var/log/nginx/onemoreslice.access.log;
    error_log  /var/log/nginx/onemoreslice.error.log;

    # A React build (statikus fájlok)
    root /var/www/onemoreslice/current/frontend;
    index index.html;

    # API → Laravel a php-fpm-en keresztül (Unix socketen)
    location /api/ {
        root /var/www/onemoreslice/current/backend/public;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # $realpath_root: a symlinket feloldja a valódi release-útvonalra, így a symlink-csere után
        # a PHP már az új release fájljait kapja (különben a régi útvonal a gyorsítótárban ragadhatna)
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Feltöltött termékképek – a közös (shared) mappából, minden release ugyanazt látja
    location /uploads/ {
        alias /var/www/onemoreslice/shared/uploads/;
        expires 7d;
        access_log off;
    }

    # React Router: minden más az index.html-re esik vissza
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
